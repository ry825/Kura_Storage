        - SHARE_NOT_FOUND
        - SHARE_MEMBER_NOT_FOUND
        - SHARE_CONFLICT
        - SHARE_OPERATION_NOT_ALLOWED
        - INVALID_SEARCH_QUERY
        - INVALID_SEARCH_FILTER
        - INVALID_RECENT_FILES_REQUEST
        - INVALID_ORGANIZATION_REQUEST
        - INVALID_FAVORITES_REQUEST
        - TAG_LIMIT_EXCEEDED
        - ENTRY_TAG_LIMIT_EXCEEDED
        - TAG_NOT_FOUND
        - TAG_NAME_CONFLICT
        - INTERNAL_ERROR
