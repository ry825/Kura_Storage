openapi: 3.1.0
info:
  title: KuraStorage API
  version: 1.0.0
  description: HTTP contract for the KuraStorage MVP and current Phase 1 file-management extensions.
servers:
  - url: https://api.kurastorage.example/api/v1
    description: Example deployment; the actual hostname is supplied outside source control.
tags:
  - name: System
  - name: Authentication
  - name: Files
  - name: Sharing
  - name: Search
  - name: Activities
  - name: Transfers
  - name: Backup
  - name: Media
  - name: Trash
  - name: Administration
paths:
  /system/health:
    get:
      tags: [System]
      operationId: getSystemHealth
      summary: Check API and storage availability
      security: []
      responses:
        "200":
          description: Current minimal service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealthResponse"
              examples:
                available:
                  externalValue: ../fixtures/system-health-response.json
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/storage:
    get:
      tags: [Administration]
      operationId: getAdminStorageStatus
      summary: Get storage capacity and trash retention status for administrators
      description: Read-only administration status. This request never starts a purge run.
      responses:
        "200":
          description: Current storage capacity, trash aggregates, and latest purge run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStorageStatus"
              examples:
                available:
                  externalValue: ../fixtures/admin-storage-response.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/media-cache:
    get:
      tags: [Administration]
      operationId: getAdminMediaCacheStatus
      summary: Get media cache aggregates and the latest cleanup run
      description: Admin-only read model. It never returns file names, paths, users, job inputs, leases, or plaintext idempotency keys.
      responses:
        "200":
          description: Current READY low/medium cache aggregates, media job counts, and cleanup run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMediaCacheStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/media-cache/cleanup-requests:
    post:
      tags: [Administration]
      operationId: requestAdminMediaCacheCleanup
      summary: Persist an asynchronous manual media cache cleanup request
      description: The request only creates or returns a persistent run. A Worker performs cleanup later. Replaying the same administrator, key, and payload returns the same run.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The persistent cleanup run was accepted or returned idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCleanupRunSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/register-device:
    post:
      tags: [Authentication]
      operationId: registerDevice
      summary: Register an Android device from the local direct route
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Device registration and authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The request did not use LOCAL_DIRECT or the user cannot register a device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a registered device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Rotate a refresh token and issue a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token rotation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: The session was revoked or was already inactive.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /shares/candidates:
    get:
      tags: [Sharing]
      operationId: listShareCandidates
      summary: List active family users available as share recipients
      responses:
        "200":
          description: Active users other than the authenticated user, ordered by display name and ID.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: "#/components/schemas/ShareCandidate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /shares:
    post:
      tags: [Sharing]
      operationId: createShare
      summary: Share an owned active file or folder with one or more users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: The share was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Sharing]
      operationId: listShares
      summary: List owned shares or directly received share roots
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [owned, received]
        - name: targetType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FileEntryType"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of direct share roots; folder descendants are not expanded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /shares/{shareId}:
    parameters:
      - $ref: "#/components/parameters/ShareId"
    get:
      tags: [Sharing]
      operationId: getShare
      summary: Get a share visible to its owner or an active direct member
      responses:
        "200":
          description: Share details including current members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Sharing]
      operationId: deleteShare
      summary: Remove a share as its owner or a current manager
      responses:
        "204":
          description: The share and all memberships were removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /shares/{shareId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ShareId"
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Sharing]
      operationId: setShareMember
      summary: Add a member or idempotently replace the current permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetShareMemberRequest"
      responses:
        "200":
          description: The updated share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Sharing]
      operationId: removeShareMember
      summary: Remove one member and remove an empty share
      responses:
        "204":
          description: The membership was removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List active entries owned by the authenticated user
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, updatedAt]
            default: updatedAt
        - name: order
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of active entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /search:
    get:
      tags: [Search]
      operationId: searchFiles
      summary: Search the authenticated user's currently readable files and folders
      description: >-
        At least q or one filter is required. One- and two-code-point q values use prefix
        matching; longer values use case-insensitive contains matching. Authorization,
        filtering, counting, and paging are evaluated in PostgreSQL before results are returned.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: entryType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FileEntryType"
        - name: fileCategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SearchFileCategory"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SearchFileStatus"
        - name: updatedFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: updatedTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: minSize
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxSize
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: ownerUserId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: shareTargetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: tagId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items:
              type: string
              format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A deterministic page containing readable matches only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
              examples:
                missingCandidate:
                  value:
                    items:
                      - id: 00000000-0000-4000-8000-000000000001
                        entryType: FILE
                        name: example.pdf
                        mimeType: application/pdf
                        fileCategory: DOCUMENT
                        size: 12345
                        status: MISSING_CANDIDATE
                        updatedAt: 2026-08-24T00:00:00Z
                        owner:
                          id: 00000000-0000-4000-8000-000000000002
                          displayName: Family member
                        permission: VIEWER
                        permissionSource: INHERITED
                        shareTargetId: 00000000-0000-4000-8000-000000000003
                    page: 1
                    pageSize: 50
                    totalCount: 1
        "400":
          description: Search query or filter validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidQuery:
                  value:
                    code: INVALID_SEARCH_QUERY
                    message: The request could not be completed.
                    requestId: request-id
                    details: {}
                invalidFilter:
                  value:
                    code: INVALID_SEARCH_FILTER
                    message: The request could not be completed.
                    requestId: request-id
                    details: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /activities:
    get:
      tags: [Activities]
      operationId: listActivities
      summary: List user-visible successful activity
      description: >-
        Returns activity where the authenticated user is the actor, can currently read the
        target through ownership or sharing, or owns a purged target snapshot. ADMIN role
        does not grant implicit access. Visibility is re-evaluated on every request.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserActivityType"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: Opaque keyset cursor returned by the previous page.
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A deterministic newest-first page of currently visible activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
              example:
                items:
                  - type: EDIT
                    occurredAt: 2026-09-02T01:02:03Z
                    actorDisplayName: Alex
                    actorDeviceName: Phone
                    targetEntryId: 00000000-0000-4000-8000-000000000001
                    targetType: FILE
                    targetName: notes.txt
                    ownerDisplayName: Alex
                    sourceParentName: null
                    destinationParentName: null
                    resultingFileVersion: 2
                    editKind: TEXT_SAVE
                    recipientDisplayName: null
                    sharePermission: null
                    shareAction: null
                    deleteKind: null
                nextCursor: null
        "400":
          description: The type, cursor, or page size is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_ACTIVITY_REQUEST
                message: The request could not be completed.
                requestId: request-id
                details: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /recent-files:
    get:
      tags: [Recent Files]
      operationId: listRecentFiles
      summary: List the authenticated user's recently opened readable files
      description: >-
        Re-evaluates current ownership and sharing in PostgreSQL. Revoked, trashed,
        operation-blocked, and deleted files are excluded without deleting retained history.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A deterministic page of currently readable recent files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentFilePage"
        "400":
          description: Pagination is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_RECENT_FILES_REQUEST
                message: The request could not be completed.
                requestId: request-id
                details: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /recent-files/{fileId}:
    put:
      tags: [Recent Files]
      operationId: recordRecentFile
      summary: Record that the authenticated user successfully opened a file
      description: >-
        Has no request body. Uses server time and atomically re-evaluates that the target is
        an active readable file before the idempotent upsert.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The user-file history row was inserted or advanced using server time.
        "400":
          description: A request body or client-supplied history state is not accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The file is absent, unreadable, not active, not a file, or operation-blocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: FILE_NOT_FOUND
                message: The request could not be completed.
                requestId: request-id
                details: {}
        "500":
          $ref: "#/components/responses/InternalServerError"
  /favorites:
    get:
      tags: [Organization]
      operationId: listFavorites
      summary: List the authenticated user's currently readable favorite entries
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: A deterministic page ordered by favorite time descending and entry ID ascending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoritePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /favorites/{entryId}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    put:
      tags: [Organization]
      operationId: addFavorite
      summary: Idempotently favorite one currently readable active entry
      description: Has no request body. Actor identity and favorite time are server-derived.
      responses:
        "204": { description: The favorite exists. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Organization]
      operationId: removeFavorite
      summary: Idempotently remove the authenticated user's favorite relation
      description: Has no request body and does not reveal whether the entry or relation exists.
      responses:
        "204": { description: The authenticated user's favorite relation is absent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /tags:
    get:
      tags: [Organization]
      operationId: listTags
      summary: List the authenticated user's private tags
      responses:
        "200":
          description: Tags ordered by normalized case-insensitive name and ID.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/TagItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    post:
      tags: [Organization]
      operationId: createTag
      summary: Create a private tag for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagNameRequest" }
      responses:
        "201":
          description: Tag created using server identity and time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /tags/{tagId}:
    parameters:
      - $ref: "#/components/parameters/TagId"
    patch:
      tags: [Organization]
      operationId: renameTag
      summary: Rename one private tag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagNameRequest" }
      responses:
        "200":
          description: Renamed tag, or the unchanged tag for an idempotent retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Organization]
      operationId: deleteTag
      summary: Delete one private tag and its entry relations
      description: Has no request body and never changes another user's tags or file entries.
      responses:
        "204": { description: Tag and its relations deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /files/{entryId}/organization:
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      tags: [Organization]
      operationId: getEntryOrganization
      summary: Get the authenticated user's private organization state for one readable entry
      responses:
        "200":
          description: Current favorite and attached-tag state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntryOrganizationState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /files/{entryId}/tags/{tagId}:
    parameters:
      - $ref: "#/components/parameters/EntryId"
      - $ref: "#/components/parameters/TagId"
    put:
      tags: [Organization]
      operationId: attachTag
      summary: Idempotently attach an owned tag to a currently readable active entry
      description: Has no request body. Viewer and stronger readable permissions may organize their own metadata.
      responses:
        "204": { description: The tag relation exists. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Organization]
      operationId: detachTag
      summary: Idempotently detach the authenticated user's tag relation
      description: Has no request body and remains available after permission loss or missing transitions.
      responses:
        "204": { description: The authenticated user's relation is absent. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /files/upload:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Stream one multipart file into the authenticated user's storage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFileRequest"
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: The verified file, or the existing result of an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: The declared or received file size exceeds the configured limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The received size or optional SHA-256 does not match the declared metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          description: The dedicated storage does not have sufficient capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /backup/compare:
    post:
      tags: [Backup]
      operationId: compareBackupCandidates
      summary: Classify authenticated-device backup candidates without mutating server state
      description: User and device identity come from the access token and server session. Omitted candidates never delete files or receipts. Destination create permission, current file state, and remote-file edit permission are evaluated for every request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupCompareRequest"
      responses:
        "200":
          description: One deterministic result for every input candidate in request order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCompareResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /upload-sessions:
    post:
      tags: [Transfers]
      operationId: createUploadSession
      summary: Create or idempotently resume a sequential upload session
      description: The Idempotency-Key is scoped to the authenticated user. Reusing it with identical metadata returns the existing session; different metadata returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "200":
          description: Existing session returned for an idempotent retry.
          headers:
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "201":
          description: Session created.
          headers:
            Location:
              schema:
                type: string
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /upload-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    get:
      tags: [Transfers]
      operationId: getUploadSession
      summary: Get the authoritative state and next offset for an upload session
      responses:
        "200":
          description: Current session state. A read does not extend its expiry.
          headers:
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Transfers]
      operationId: cancelUploadSession
      summary: Idempotently cancel an unfinished upload and remove its temporary file
      responses:
        "204":
          description: Session cancelled or already cancelled.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /upload-sessions/{sessionId}/chunks:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    put:
      tags: [Transfers]
      operationId: uploadSessionChunk
      summary: Stream the next contiguous chunk into an upload session
      description: Chunks are sequential. An exact retry of the last accepted offset, length, and SHA-256 is idempotent; gaps, overlaps, changed retries, and expired sessions return 409.
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: X-Chunk-Sha256
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Fa-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Chunk accepted or verified as an exact replay. A successful new chunk extends idle expiry without exceeding absolute expiry.
          headers:
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadChunkResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /upload-sessions/{sessionId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    post:
      tags: [Transfers]
      operationId: completeUploadSession
      summary: Verify and atomically publish a completed upload
      responses:
        "200":
          description: Published file, or the same file for an idempotent completion retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /folders:
    post:
      tags: [Files]
      operationId: createFolder
      summary: Create a folder in the authenticated user's storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "200":
          description: Folder created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: getFile
      summary: Get metadata for an owned entry
      responses:
        "200":
          description: Entry metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Files]
      operationId: updateFile
      summary: Rename or move one owned active file or folder
      description: Exactly one of name and parentId must be supplied. Repeating the current normalized name or parent is a side-effect-free success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileRequest"
      responses:
        "200":
          description: The renamed or moved entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Files]
      operationId: moveFileToTrash
      summary: Move an owned file or folder to trash
      responses:
        "200":
          description: The entry was moved to trash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}/text:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: getFileText
      summary: Read the current strict UTF-8 text and version metadata
      description: Requires the current VIEWER permission or stronger. UTF-8 BOM is omitted from content; the physical content is limited to 1 MiB.
      responses:
        "200":
          description: Current text and immutable-content integrity metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDocument"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [Files]
      operationId: saveFileText
      summary: Save strict UTF-8 text as a new immutable file version
      description: Requires current EDITOR permission or stronger. expectedVersion prevents unconditional overwrite. Retrying the identical request with the same operationId returns the original result without creating another version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTextRequest"
            example:
              content: "updated content"
              expectedVersion: 4
              operationId: b1cf0e84-e0cc-4af5-8123-0f57baf7eeec
      responses:
        "200":
          description: New current version, or the original result of an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextMutationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /files/{fileId}/versions:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: listFileVersions
      summary: List immutable version metadata newest first
      description: Current VIEWER permission is reevaluated on every request. Content and internal storage paths are never included.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Stable metadata page ordered by version descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVersionPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /files/{fileId}/versions/{version}/text:
    parameters:
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/FileVersion"
    get:
      tags: [Files]
      operationId: getFileVersionText
      summary: Read one immutable historical text version
      description: Requires current VIEWER permission or stronger and verifies stored size and SHA-256 before returning content.
      responses:
        "200":
          description: Historical text and integrity metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextDocument"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /files/{fileId}/versions/{version}/restore:
    parameters:
      - $ref: "#/components/parameters/FileId"
      - $ref: "#/components/parameters/FileVersion"
    post:
      tags: [Files]
      operationId: restoreFileVersion
      summary: Publish a historical version as a new current version
      description: Requires current EDITOR permission or stronger. The target version and the pre-restore current version remain immutable; version numbers are never reused. operationId makes authorization-refresh retries idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreTextVersionRequest"
            example:
              expectedVersion: 7
              operationId: b1cf0e84-e0cc-4af5-8123-0f57baf7eeec
      responses:
        "200":
          description: Newly published RESTORE version, or the original idempotent result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextMutationResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /files/{fileId}/content:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download original or derived media content with optional single-range support
      parameters:
        - name: variant
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaVariant"
        - name: disposition
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaDisposition"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: ^bytes=[0-9]*-[0-9]*$
      responses:
        "200":
          description: Complete original file.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Range:
              required: true
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "202":
          description: The requested derivative is queued or being generated.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAcceptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "416":
          description: The range is invalid or outside the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      tags: [Files]
      operationId: inspectFileContent
      summary: Inspect selected original or derived media size, media type, and range support
      parameters:
        - name: variant
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaVariant"
        - name: disposition
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MediaDisposition"
      responses:
        "200":
          description: Selected ready content headers without a response body.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
            Content-Type:
              required: true
              schema:
                type: string
        "202":
          description: The selected derivative is queued or being generated; no response body is required for HEAD.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
            Location:
              required: true
              schema:
                type: string
            X-Kura-Media-Job-Id:
              required: true
              schema:
                type: string
                format: uuid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /media-jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Media]
      operationId: getMediaJob
      summary: Get an authorized media generation job
      responses:
        "200":
          description: Current public media job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /media-jobs/{jobId}/retry:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Media]
      operationId: retryMediaJob
      summary: Retry a transiently failed authorized media job
      responses:
        "202":
          description: One idempotently queued replacement job.
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}/missing/recheck:
    parameters:
      - $ref: "#/components/parameters/FileId"
    post:
      tags: [Files]
      operationId: recheckMissingFile
      summary: Safely recheck an owned missing or missing-candidate entry
      responses:
        "200":
          description: Current entry metadata after rechecking the managed path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}/missing-index-entry:
    parameters:
      - $ref: "#/components/parameters/FileId"
    delete:
      tags: [Files]
      operationId: deleteMissingFileIndexEntry
      summary: Delete only database-managed index information for an owned missing entry
      description: This operation never deletes, moves, or creates HDD content.
      responses:
        "204":
          description: Missing index entry and eligible missing descendants were deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: List trashed entries owned by the authenticated user
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of trashed entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /trash/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    delete:
      tags: [Trash]
      operationId: permanentlyDeleteTrashEntry
      summary: Permanently delete an owned trash root and all descendants
      description: >-
        The operation is irreversible. Reusing the same Idempotency-Key for the same entry
        returns the completed result; reusing it for another entry returns IDEMPOTENCY_CONFLICT.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The entry was permanently deleted, or the same request already completed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}/restore:
    parameters:
      - $ref: "#/components/parameters/FileId"
    post:
      tags: [Trash]
      operationId: restoreFile
      summary: Restore an owned trashed entry to its original parent
      responses:
        "200":
          description: Entry restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UploadSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    UploadOffset:
      description: Authoritative next byte offset persisted by the server.
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is absent, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user or device cannot perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The owned resource was not found; ownership is not disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current state or idempotency metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dedicated storage or a required service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The file or chunk exceeds its configured size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: A chunk or completed file failed checksum or length verification.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnsupportedMediaType:
      description: The request content type or target file MIME is unsupported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The active-session or concurrent-chunk limit was reached.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientStorage:
      description: Dedicated storage does not have sufficient safe capacity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SystemHealthResponse:
      type: object
      additionalProperties: false
      required: [api, protocolVersion, storage]
      properties:
        api:
          type: string
          enum: [AVAILABLE]
        protocolVersion:
          type: integer
          const: 2
        storage:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
    AdminStorageStatus:
      type: object
      additionalProperties: false
      required: [storage, totalBytes, availableBytes, capacityWarningThresholdBytes, capacityWarning, trashBytes, expiredTrashRootCount, retentionDays, recoveryRequiredPurgeCount, lastPurgeRun]
      properties:
        storage:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        totalBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
        availableBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
        capacityWarningThresholdBytes:
          type: integer
          format: int64
          minimum: 1
        capacityWarning:
          type: [boolean, "null"]
        trashBytes:
          type: integer
          format: int64
          minimum: 0
          description: Estimated from TRASHED file-size snapshots, not filesystem allocation.
        expiredTrashRootCount:
          type: integer
          minimum: 0
        retentionDays:
          type: integer
          minimum: 30
        recoveryRequiredPurgeCount:
          type: integer
          minimum: 0
        lastPurgeRun:
          oneOf:
            - $ref: "#/components/schemas/TrashPurgeRunSummary"
            - type: "null"
    TrashPurgeRunSummary:
      type: object
      additionalProperties: false
      required: [startedAt, completedAt, status, examinedRootCount, deletedRootCount, releasedBytes, errorCount]
      properties:
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [RUNNING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED]
        examinedRootCount:
          type: integer
          minimum: 0
        deletedRootCount:
          type: integer
          minimum: 0
        releasedBytes:
          type: integer
          format: int64
          minimum: 0
        errorCount:
          type: integer
          minimum: 0
    AdminMediaCacheStatus:
      type: object
      additionalProperties: false
      required: [cacheBytes, imageLowBytes, imageMediumBytes, videoLowBytes, videoMediumBytes, highWatermarkBytes, lowWatermarkBytes, queuedJobCount, runningJobCount, failedJobCount, pendingRunCount, runningRunCount, lastCleanupRun]
      properties:
        cacheBytes:
          type: integer
          format: int64
          minimum: 0
        imageLowBytes:
          type: integer
          format: int64
          minimum: 0
        imageMediumBytes:
          type: integer
          format: int64
          minimum: 0
        videoLowBytes:
          type: integer
          format: int64
          minimum: 0
        videoMediumBytes:
          type: integer
          format: int64
          minimum: 0
        highWatermarkBytes:
          type: integer
          format: int64
          minimum: 1
        lowWatermarkBytes:
          type: integer
          format: int64
          minimum: 0
        queuedJobCount:
          type: integer
          minimum: 0
        runningJobCount:
          type: integer
          minimum: 0
        failedJobCount:
          type: integer
          minimum: 0
        pendingRunCount:
          type: integer
          minimum: 0
        runningRunCount:
          type: integer
          minimum: 0
        lastCleanupRun:
          oneOf:
            - $ref: "#/components/schemas/MediaCleanupRunSummary"
            - type: "null"
    MediaCleanupRunSummary:
      type: object
      additionalProperties: false
      required: [id, trigger, status, requestedAt, startedAt, completedAt, examinedCount, deletedCount, releasedBytes, failureCount, remainingCacheBytes, failureCode]
      properties:
        id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [SCHEDULED, MANUAL]
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETED, FAILED]
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        examinedCount:
          type: integer
          minimum: 0
        deletedCount:
          type: integer
          minimum: 0
        releasedBytes:
          type: integer
          format: int64
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        remainingCacheBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
        failureCode:
          type: [string, "null"]
          enum: [STORAGE_UNAVAILABLE, PARTIAL_DELETE_FAILURE, CLEANUP_FAILED, null]
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [username, password, deviceName]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        deviceName:
          type: string
          minLength: 1
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, deviceId]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        deviceId:
          type: string
          format: uuid
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [deviceId, refreshToken]
      properties:
        deviceId:
          type: string
          format: uuid
        refreshToken:
          type: string
          minLength: 32
          maxLength: 2048
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [deviceId, refreshToken]
      properties:
        deviceId:
          type: string
          format: uuid
        refreshToken:
          type: string
          minLength: 32
          maxLength: 2048
    TokenResponse:
      type: object
      additionalProperties: false
      required: [userId, deviceId, accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt, role]
      properties:
        userId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [ADMIN, MEMBER]
    UploadFileRequest:
      type: object
      additionalProperties: false
      required: [destinationFolderId, fileName, size, file]
      properties:
        destinationFolderId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          format: int64
          minimum: 0
        contentType:
          type: string
          maxLength: 255
        sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        file:
          type: string
          format: binary
    CreateUploadSessionRequest:
      type: object
      additionalProperties: false
      required: [destinationFolderId, fileName, size]
      properties:
        destinationFolderId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
        contentType:
          type: [string, "null"]
          maxLength: 255
        sha256:
          type: [string, "null"]
          pattern: ^[A-Fa-f0-9]{64}$
        backup:
          oneOf:
            - $ref: "#/components/schemas/BackupUploadContext"
            - type: "null"
    BackupUploadContext:
      type: object
      additionalProperties: false
      required: [localDocumentKey, relativePath, modifiedAt, decision, expectedRemoteFileId, expectedRemoteFileVersion]
      properties:
        localDocumentKey:
          type: string
          format: uuid
          description: Opaque UUID generated inside the authenticated user and device namespace; never a raw URI or physical path.
        relativePath:
          type: string
          minLength: 1
          maxLength: 2048
        modifiedAt:
          type: string
          format: date-time
        decision:
          type: string
          enum: [NEW, CHANGED]
        expectedRemoteFileId:
          type: [string, "null"]
          format: uuid
          description: Required only for CHANGED and revalidated against the server receipt.
        expectedRemoteFileVersion:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: Required only for CHANGED and revalidated at session creation and completion.
    BackupCompareRequest:
      type: object
      additionalProperties: false
      required: [destinationFolderId, items]
      properties:
        destinationFolderId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/BackupCompareCandidate"
    BackupCompareCandidate:
      type: object
      additionalProperties: false
      required: [localDocumentKey, relativePath, size, modifiedAt, checksum]
      properties:
        localDocumentKey:
          type: string
          format: uuid
        relativePath:
          type: string
          minLength: 1
          maxLength: 2048
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
        modifiedAt:
          type: string
          format: date-time
        checksum:
          type: [string, "null"]
          pattern: ^[A-Fa-f0-9]{64}$
    BackupCompareResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/BackupCompareResult"
    BackupCompareResult:
      type: object
      additionalProperties: false
      required: [localDocumentKey, decision, remoteFileId, expectedRemoteFileVersion, errorCode]
      properties:
        localDocumentKey:
          type: string
          format: uuid
        decision:
          type: string
          enum: [NEW, CHANGED, ALREADY_UPLOADED, BLOCKED_CURRENT_STATE]
        remoteFileId:
          type: [string, "null"]
          format: uuid
        expectedRemoteFileVersion:
          type: [integer, "null"]
          format: int64
          minimum: 1
        errorCode:
          type: [string, "null"]
    UploadSession:
      type: object
      additionalProperties: false
      required: [id, status, size, receivedBytes, nextOffset, preferredChunkBytes, maximumChunkBytes, expiresAt, absoluteExpiresAt, resumable, file]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, COMPLETING, COMPLETED, CANCELLED, EXPIRED, RECOVERY_REQUIRED]
        size:
          type: integer
          format: int64
          minimum: 0
        receivedBytes:
          type: integer
          format: int64
          minimum: 0
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        preferredChunkBytes:
          type: integer
          minimum: 262144
        maximumChunkBytes:
          type: integer
          minimum: 262144
        expiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        resumable:
          type: boolean
        file:
          oneOf:
            - $ref: "#/components/schemas/FileEntry"
            - type: "null"
    UploadChunkResult:
      type: object
      additionalProperties: false
      required: [offset, length, sha256, receivedBytes, nextOffset, expiresAt, replayed]
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
        length:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        receivedBytes:
          type: integer
          format: int64
          minimum: 0
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
    UpdateFileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parentId:
          type: string
          format: uuid
    SaveTextRequest:
      type: object
      additionalProperties: false
      required: [content, expectedVersion, operationId, acknowledgeLossySource]
      properties:
        content:
          type: string
          maxLength: 1048576
          description: Strict Unicode text. It is stored using the exact source encoding, or UTF-8 after an acknowledged lossy preview. The encoded content must not exceed 1 MiB.
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        operationId:
          type: string
          format: uuid
        acknowledgeLossySource:
          type: boolean
          description: Must be true when the current raw source could only be decoded as a lossy UTF-8 replacement preview.
    RestoreTextVersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, operationId]
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        operationId:
          type: string
          format: uuid
    TextDocument:
      type: object
      additionalProperties: false
      required: [content, encoding, decodeStatus, fileVersion, size, sha256]
      properties:
        content:
          type: string
          maxLength: 1048576
        encoding:
          type: string
          enum: [UTF-8, UTF-16LE, UTF-16BE]
        decodeStatus:
          type: string
          enum: [EXACT, LOSSY]
        fileVersion:
          type: integer
          format: int64
          minimum: 1
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 1048576
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    TextMutationResult:
      type: object
      additionalProperties: false
      required: [fileVersion, size, sha256, changeKind, createdAt]
      properties:
        fileVersion:
          type: integer
          format: int64
          minimum: 1
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 1048576
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        changeKind:
          type: string
          enum: [TEXT_EDIT, RESTORE]
        createdAt:
          type: string
          format: date-time
    FileVersionItem:
      type: object
      additionalProperties: false
      required: [version, size, sha256, changeKind, actorDisplayName, createdAt]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 1048576
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        changeKind:
          type: string
          enum: [UPLOAD, TEXT_EDIT, EXTERNAL_CHANGE, RESTORE]
        actorDisplayName:
          type: string
          minLength: 1
          maxLength: 128
          description: Current actor display name, External change, or Deleted user.
        createdAt:
          type: string
          format: date-time
    FileVersionPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileVersionItem"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalCount:
          type: integer
          minimum: 0
    SharePermission:
      type: string
      enum: [VIEWER, CONTRIBUTOR, EDITOR, MANAGER]
    PermissionSource:
      type: string
      enum: [OWNER, DIRECT, INHERITED]
    OwnerSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    ShareCandidate:
      type: object
      additionalProperties: false
      required: [userId, displayName]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    ShareMemberItem:
      type: object
      additionalProperties: false
      required: [userId, displayName, permission]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        permission:
          $ref: "#/components/schemas/SharePermission"
    CreateShareMember:
      type: object
      additionalProperties: false
      required: [userId, permission]
      properties:
        userId:
          type: string
          format: uuid
        permission:
          $ref: "#/components/schemas/SharePermission"
    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [targetEntryId, members]
      properties:
        targetEntryId:
          type: string
          format: uuid
        members:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CreateShareMember"
    SetShareMemberRequest:
      type: object
      additionalProperties: false
      required: [permission]
      properties:
        permission:
          $ref: "#/components/schemas/SharePermission"
    ShareItem:
      type: object
      additionalProperties: false
      required: [id, targetEntryId, entryType, name, owner, permission, members, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        targetEntryId:
          type: string
          format: uuid
        entryType:
          $ref: "#/components/schemas/FileEntryType"
        name:
          type: string
          minLength: 1
          maxLength: 255
        owner:
          $ref: "#/components/schemas/OwnerSummary"
        permission:
          $ref: "#/components/schemas/SharePermission"
        members:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ShareMemberItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SharePage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShareItem"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
        totalCount:
          type: integer
          minimum: 0
    FileEntry:
      type: object
      additionalProperties: false
      required: [id, name, entryType, size, status, fileVersion, trashedAt, purgeEligibleAt, missingDetectedAt, missingLastCheckedAt, createdAt, updatedAt, owner, permission, permissionSource]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        entryType:
          $ref: "#/components/schemas/FileEntryType"
        mimeType:
          type: [string, "null"]
        size:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/FileEntryStatus"
        fileVersion:
          type: integer
          format: int64
          minimum: 1
        trashedAt:
          type: [string, "null"]
          format: date-time
        purgeEligibleAt:
          type: [string, "null"]
          format: date-time
          description: Server-computed retention deadline for a trashed root; null otherwise.
        missingDetectedAt:
          type: [string, "null"]
          format: date-time
          description: First confirmed observation time for the current missing episode.
        missingLastCheckedAt:
          type: [string, "null"]
          format: date-time
          description: Most recent safe filesystem check for the current missing episode.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/OwnerSummary"
        permission:
          $ref: "#/components/schemas/SharePermission"
        permissionSource:
          $ref: "#/components/schemas/PermissionSource"
        shareTargetId:
          type: [string, "null"]
          format: uuid
    FileEntryPage:
      type: object
      additionalProperties: false
      required: [parentId, items, page, pageSize, totalCount]
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
        totalCount:
          type: integer
          format: int64
          minimum: 0
    SearchResultItem:
      $ref: "#/components/schemas/AccessibleEntryMetadata"
    AccessibleEntryMetadata:
      type: object
      required: [id, entryType, name, mimeType, fileCategory, size, status, updatedAt, owner, permission, permissionSource, shareTargetId]
      properties:
        id:
          type: string
          format: uuid
        entryType:
          $ref: "#/components/schemas/FileEntryType"
        name:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: [string, "null"]
          maxLength: 255
        fileCategory:
          oneOf:
            - $ref: "#/components/schemas/SearchFileCategory"
            - type: "null"
        size:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/SearchFileStatus"
        updatedAt:
          type: string
          format: date-time
        owner:
          $ref: "#/components/schemas/OwnerSummary"
        permission:
          $ref: "#/components/schemas/EffectivePermission"
        permissionSource:
          $ref: "#/components/schemas/PermissionSource"
        shareTargetId:
          type: [string, "null"]
          format: uuid
    SearchPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalCount:
          type: integer
          minimum: 0
    UserActivityType:
      type: string
      enum: [UPLOAD, MOVE, EDIT, SHARE, DELETE]
    ActivityTargetType:
      type: string
      enum: [FILE, FOLDER]
    ActivityItem:
      type: object
      additionalProperties: false
      required:
        - type
        - occurredAt
        - actorDisplayName
        - targetType
        - targetName
        - ownerDisplayName
      properties:
        type:
          $ref: "#/components/schemas/UserActivityType"
        occurredAt:
          type: string
          format: date-time
        actorDisplayName:
          type: string
          maxLength: 128
        actorDeviceName:
          type: [string, "null"]
          maxLength: 128
        targetEntryId:
          type: [string, "null"]
          format: uuid
          description: Present only while the target exists and is currently accessible.
        targetType:
          $ref: "#/components/schemas/ActivityTargetType"
        targetName:
          type: string
          maxLength: 255
        ownerDisplayName:
          type: string
          maxLength: 128
        sourceParentName:
          type: [string, "null"]
          maxLength: 255
        destinationParentName:
          type: [string, "null"]
          maxLength: 255
        resultingFileVersion:
          type: [integer, "null"]
          format: int64
          minimum: 1
        editKind:
          type: [string, "null"]
          enum: [TEXT_SAVE, VERSION_RESTORE, BACKUP_UPLOAD, null]
        recipientDisplayName:
          type: [string, "null"]
          maxLength: 128
        sharePermission:
          type: [string, "null"]
          enum: [VIEWER, CONTRIBUTOR, EDITOR, MANAGER, null]
        shareAction:
          type: [string, "null"]
          enum: [CREATED, UPDATED, REVOKED, null]
        deleteKind:
          type: [string, "null"]
          enum: [TRASHED, PURGED, null]
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        nextCursor:
          type: [string, "null"]
          maxLength: 128
    RecentFileItem:
      allOf:
        - $ref: "#/components/schemas/AccessibleEntryMetadata"
        - type: object
          required: [openedAt]
          properties:
            openedAt:
              type: string
              format: date-time
    RecentFilePage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecentFileItem"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalCount:
          type: integer
          minimum: 0
    FavoriteItem:
      allOf:
        - $ref: "#/components/schemas/AccessibleEntryMetadata"
        - type: object
          required: [favoritedAt]
          properties:
            favoritedAt:
              type: string
              format: date-time
    FavoritePage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FavoriteItem" }
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalCount:
          type: integer
          minimum: 0
    TagNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
    TagItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
    EntryOrganizationState:
      type: object
      additionalProperties: false
      required: [isFavorite, tags]
      properties:
        isFavorite:
          type: boolean
        tags:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/TagItem" }
    MediaVariant:
      type: string
      default: original
      enum: [original, thumbnail, image-low, image-medium, video-low, video-medium]
    MediaDisposition:
      type: string
      default: inline
      enum: [inline, attachment]
    MediaAcceptedResponse:
      type: object
      additionalProperties: false
      required: [status, jobId, jobStatusUrl, retryAfterSeconds]
      properties:
        status:
          type: string
          const: GENERATING
        jobId:
          type: string
          format: uuid
        jobStatusUrl:
          type: string
          pattern: ^/api/v1/media-jobs/[0-9a-f-]+$
        retryAfterSeconds:
          type: integer
          minimum: 1
    MediaJob:
      type: object
      additionalProperties: false
      required: [jobId, status, progressPercent, processedDurationMs, totalDurationMs, queuePosition, retryable, retryAfterSeconds, contentUrl]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [GENERATING, READY, FAILED, CANCELLED]
        progressPercent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        processedDurationMs:
          type: [integer, "null"]
          format: int64
          minimum: 0
        totalDurationMs:
          type: [integer, "null"]
          format: int64
          minimum: 0
        queuePosition:
          type: [integer, "null"]
          minimum: 1
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 0
        contentUrl:
          type: [string, "null"]
    SearchFileCategory:
      type: string
      enum: [IMAGE, VIDEO, AUDIO, DOCUMENT, ARCHIVE, OTHER]
    SearchFileStatus:
      type: string
      enum: [ACTIVE, MISSING_CANDIDATE, MISSING]
    EffectivePermission:
      type: string
      enum: [VIEWER, CONTRIBUTOR, EDITOR, MANAGER, OWNER]
    FileEntryType:
      type: string
      enum: [FILE, FOLDER]
    FileEntryStatus:
      type: string
      enum: [ACTIVE, MISSING_CANDIDATE, MISSING, TRASHED]
    SortOrder:
      type: string
      enum: [asc, desc]
      default: desc
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId, details]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - AUTHENTICATION_REQUIRED
        - DEVICE_REGISTRATION_REQUIRES_LOCAL_DIRECT
        - DEVICE_REVOKED
        - REFRESH_TOKEN_REUSED
        - STORAGE_UNAVAILABLE
        - STORAGE_CAPACITY_INSUFFICIENT
        - FILE_NOT_FOUND
        - FILE_VERSION_NOT_FOUND
        - FILE_VERSION_CONFLICT
        - FILE_VERSION_CORRUPT
        - FILE_STATE_CONFLICT
        - UNSUPPORTED_TEXT_TYPE
        - UNSUPPORTED_MEDIA_TYPE
        - TEXT_ENCODING_INVALID
        - TEXT_SIZE_LIMIT_EXCEEDED
        - RATE_LIMIT_EXCEEDED
        - FILE_NAME_CONFLICT
        - FILE_MOVE_CYCLE
        - FILE_OPERATION_NOT_ALLOWED
        - FILE_RESTORE_CONFLICT
        - RECOVERY_REQUIRED
        - RANGE_NOT_SATISFIABLE
        - IDEMPOTENCY_CONFLICT
        - UPLOAD_SIZE_MISMATCH
        - UPLOAD_CHECKSUM_MISMATCH
        - OPERATION_SIZE_LIMIT_EXCEEDED
        - UPLOAD_SESSION_NOT_FOUND
        - UPLOAD_SESSION_EXPIRED
        - UPLOAD_SESSION_NOT_ACTIVE
        - UPLOAD_OFFSET_MISMATCH
        - CHUNK_CHECKSUM_MISMATCH
        - CHUNK_SIZE_LIMIT_EXCEEDED
        - FILE_SIZE_LIMIT_EXCEEDED
        - UPLOAD_LIMIT_REACHED
        - INVALID_SHARE_PERMISSION
        - SHARE_NOT_FOUND
        - SHARE_MEMBER_NOT_FOUND
        - SHARE_CONFLICT
        - SHARE_OPERATION_NOT_ALLOWED
        - INVALID_SEARCH_QUERY
        - INVALID_SEARCH_FILTER
        - INVALID_RECENT_FILES_REQUEST
        - INVALID_ORGANIZATION_REQUEST
        - INVALID_FAVORITES_REQUEST
        - TAG_LIMIT_EXCEEDED
        - ENTRY_TAG_LIMIT_EXCEEDED
        - TAG_NOT_FOUND
        - TAG_NAME_CONFLICT
        - MEDIA_VARIANT_UNSUPPORTED
        - MEDIA_SOURCE_NOT_ACTIVE
        - MEDIA_GENERATION_FAILED
        - MEDIA_RETRY_NOT_ALLOWED
        - MEDIA_TOOL_UNAVAILABLE
        - MEDIA_WORKER_UNAVAILABLE
        - INTERNAL_ERROR
