openapi: 3.1.0
info:
  title: KuraStorage API
  version: 1.0.0
  description: HTTP contract for the KuraStorage MVP and current Phase 1 file-management extensions.
servers:
  - url: https://api.kurastorage.example/api/v1
    description: Example deployment; the actual hostname is supplied outside source control.
tags:
  - name: System
  - name: Authentication
  - name: Files
  - name: Transfers
  - name: Trash
  - name: Administration
paths:
  /system/health:
    get:
      tags: [System]
      operationId: getSystemHealth
      summary: Check API and storage availability
      security: []
      responses:
        "200":
          description: Current minimal service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealthResponse"
              examples:
                available:
                  externalValue: ../fixtures/system-health-response.json
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/storage:
    get:
      tags: [Administration]
      operationId: getAdminStorageStatus
      summary: Get storage capacity and trash retention status for administrators
      description: Read-only administration status. This request never starts a purge run.
      responses:
        "200":
          description: Current storage capacity, trash aggregates, and latest purge run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStorageStatus"
              examples:
                available:
                  externalValue: ../fixtures/admin-storage-response.json
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/register-device:
    post:
      tags: [Authentication]
      operationId: registerDevice
      summary: Register an Android device from the local direct route
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "200":
          description: Device registration and authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The request did not use LOCAL_DIRECT or the user cannot register a device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a registered device
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Rotate a refresh token and issue a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token rotation succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: The session was revoked or was already inactive.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: List active entries owned by the authenticated user
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, updatedAt]
            default: updatedAt
        - name: order
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of active entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/upload:
    post:
      tags: [Files]
      operationId: uploadFile
      summary: Stream one multipart file into the authenticated user's storage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadFileRequest"
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "200":
          description: The verified file, or the existing result of an idempotent retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: The declared or received file size exceeds the configured limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The received size or optional SHA-256 does not match the declared metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          description: The dedicated storage does not have sufficient capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /upload-sessions:
    post:
      tags: [Transfers]
      operationId: createUploadSession
      summary: Create or idempotently resume a sequential upload session
      description: The Idempotency-Key is scoped to the authenticated user. Reusing it with identical metadata returns the existing session; different metadata returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "200":
          description: Existing session returned for an idempotent retry.
          headers:
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "201":
          description: Session created.
          headers:
            Location:
              schema:
                type: string
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "507": { $ref: "#/components/responses/InsufficientStorage" }
  /upload-sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    get:
      tags: [Transfers]
      operationId: getUploadSession
      summary: Get the authoritative state and next offset for an upload session
      responses:
        "200":
          description: Current session state. A read does not extend its expiry.
          headers:
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Transfers]
      operationId: cancelUploadSession
      summary: Idempotently cancel an unfinished upload and remove its temporary file
      responses:
        "204":
          description: Session cancelled or already cancelled.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /upload-sessions/{sessionId}/chunks:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    put:
      tags: [Transfers]
      operationId: uploadSessionChunk
      summary: Stream the next contiguous chunk into an upload session
      description: Chunks are sequential. An exact retry of the last accepted offset, length, and SHA-256 is idempotent; gaps, overlaps, changed retries, and expired sessions return 409.
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: X-Chunk-Sha256
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Fa-f0-9]{64}$
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Chunk accepted or verified as an exact replay. A successful new chunk extends idle expiry without exceeding absolute expiry.
          headers:
            Upload-Offset:
              $ref: "#/components/headers/UploadOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadChunkResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /upload-sessions/{sessionId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadSessionId"
    post:
      tags: [Transfers]
      operationId: completeUploadSession
      summary: Verify and atomically publish a completed upload
      responses:
        "200":
          description: Published file, or the same file for an idempotent completion retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /folders:
    post:
      tags: [Files]
      operationId: createFolder
      summary: Create a folder in the authenticated user's storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "200":
          description: Folder created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: getFile
      summary: Get metadata for an owned entry
      responses:
        "200":
          description: Entry metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Files]
      operationId: updateFile
      summary: Rename or move one owned active file or folder
      description: Exactly one of name and parentId must be supplied. Repeating the current normalized name or parent is a side-effect-free success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFileRequest"
      responses:
        "200":
          description: The renamed or moved entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Files]
      operationId: moveFileToTrash
      summary: Move an owned file or folder to trash
      responses:
        "200":
          description: The entry was moved to trash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}/content:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download original file content with optional single-range support
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
            pattern: ^bytes=[0-9]*-[0-9]*$
      responses:
        "200":
          description: Complete original file.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Range:
              required: true
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The range is invalid or outside the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    head:
      tags: [Files]
      operationId: inspectFileContent
      summary: Inspect original file size, media type, and range support
      responses:
        "200":
          description: Original file headers without a response body.
          headers:
            Accept-Ranges:
              schema:
                type: string
                const: bytes
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
            Content-Type:
              required: true
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: List trashed entries owned by the authenticated user
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of trashed entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /trash/{fileId}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    delete:
      tags: [Trash]
      operationId: permanentlyDeleteTrashEntry
      summary: Permanently delete an owned trash root and all descendants
      description: >-
        The operation is irreversible. Reusing the same Idempotency-Key for the same entry
        returns the completed result; reusing it for another entry returns IDEMPOTENCY_CONFLICT.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The entry was permanently deleted, or the same request already completed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files/{fileId}/restore:
    parameters:
      - $ref: "#/components/parameters/FileId"
    post:
      tags: [Trash]
      operationId: restoreFile
      summary: Restore an owned trashed entry to its original parent
      responses:
        "200":
          description: Entry restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UploadSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    UploadOffset:
      description: Authoritative next byte offset persisted by the server.
      schema:
        type: integer
        format: int64
        minimum: 0
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is absent, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user or device cannot perform the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The owned resource was not found; ownership is not disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current state or idempotency metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Dedicated storage or a required service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The file or chunk exceeds its configured size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: A chunk or completed file failed checksum or length verification.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The active-session or concurrent-chunk limit was reached.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientStorage:
      description: Dedicated storage does not have sufficient safe capacity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SystemHealthResponse:
      type: object
      additionalProperties: false
      required: [api, protocolVersion, storage]
      properties:
        api:
          type: string
          enum: [AVAILABLE]
        protocolVersion:
          type: integer
          const: 1
        storage:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
    AdminStorageStatus:
      type: object
      additionalProperties: false
      required: [storage, totalBytes, availableBytes, capacityWarningThresholdBytes, capacityWarning, trashBytes, expiredTrashRootCount, retentionDays, recoveryRequiredPurgeCount, lastPurgeRun]
      properties:
        storage:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        totalBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
        availableBytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
        capacityWarningThresholdBytes:
          type: integer
          format: int64
          minimum: 1
        capacityWarning:
          type: [boolean, "null"]
        trashBytes:
          type: integer
          format: int64
          minimum: 0
          description: Estimated from TRASHED file-size snapshots, not filesystem allocation.
        expiredTrashRootCount:
          type: integer
          minimum: 0
        retentionDays:
          type: integer
          minimum: 30
        recoveryRequiredPurgeCount:
          type: integer
          minimum: 0
        lastPurgeRun:
          oneOf:
            - $ref: "#/components/schemas/TrashPurgeRunSummary"
            - type: "null"
    TrashPurgeRunSummary:
      type: object
      additionalProperties: false
      required: [startedAt, completedAt, status, examinedRootCount, deletedRootCount, releasedBytes, errorCount]
      properties:
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [RUNNING, COMPLETED, COMPLETED_WITH_ERRORS, FAILED]
        examinedRootCount:
          type: integer
          minimum: 0
        deletedRootCount:
          type: integer
          minimum: 0
        releasedBytes:
          type: integer
          format: int64
          minimum: 0
        errorCount:
          type: integer
          minimum: 0
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [username, password, deviceName]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        deviceName:
          type: string
          minLength: 1
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, deviceId]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        deviceId:
          type: string
          format: uuid
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [deviceId, refreshToken]
      properties:
        deviceId:
          type: string
          format: uuid
        refreshToken:
          type: string
          minLength: 32
          maxLength: 2048
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [deviceId, refreshToken]
      properties:
        deviceId:
          type: string
          format: uuid
        refreshToken:
          type: string
          minLength: 32
          maxLength: 2048
    TokenResponse:
      type: object
      additionalProperties: false
      required: [deviceId, accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt, role]
      properties:
        deviceId:
          type: string
          format: uuid
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [ADMIN, MEMBER]
    UploadFileRequest:
      type: object
      additionalProperties: false
      required: [destinationFolderId, fileName, size, file]
      properties:
        destinationFolderId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          format: int64
          minimum: 0
        contentType:
          type: string
          maxLength: 255
        sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
        file:
          type: string
          format: binary
    CreateUploadSessionRequest:
      type: object
      additionalProperties: false
      required: [destinationFolderId, fileName, size]
      properties:
        destinationFolderId:
          type: string
          format: uuid
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
        contentType:
          type: [string, "null"]
          maxLength: 255
        sha256:
          type: [string, "null"]
          pattern: ^[A-Fa-f0-9]{64}$
    UploadSession:
      type: object
      additionalProperties: false
      required: [id, status, size, receivedBytes, nextOffset, preferredChunkBytes, maximumChunkBytes, expiresAt, absoluteExpiresAt, resumable, file]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE, COMPLETING, COMPLETED, CANCELLED, EXPIRED, RECOVERY_REQUIRED]
        size:
          type: integer
          format: int64
          minimum: 0
        receivedBytes:
          type: integer
          format: int64
          minimum: 0
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        preferredChunkBytes:
          type: integer
          minimum: 262144
        maximumChunkBytes:
          type: integer
          minimum: 262144
        expiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
        resumable:
          type: boolean
        file:
          oneOf:
            - $ref: "#/components/schemas/FileEntry"
            - type: "null"
    UploadChunkResult:
      type: object
      additionalProperties: false
      required: [offset, length, sha256, receivedBytes, nextOffset, expiresAt, replayed]
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
        length:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        receivedBytes:
          type: integer
          format: int64
          minimum: 0
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        replayed:
          type: boolean
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
    UpdateFileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parentId:
          type: string
          format: uuid
    FileEntry:
      type: object
      additionalProperties: false
      required: [id, name, entryType, size, status, fileVersion, trashedAt, purgeEligibleAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        entryType:
          $ref: "#/components/schemas/FileEntryType"
        mimeType:
          type: [string, "null"]
        size:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: "#/components/schemas/FileEntryStatus"
        fileVersion:
          type: integer
          format: int64
          minimum: 1
        trashedAt:
          type: [string, "null"]
          format: date-time
        purgeEligibleAt:
          type: [string, "null"]
          format: date-time
          description: Server-computed retention deadline for a trashed root; null otherwise.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FileEntryPage:
      type: object
      additionalProperties: false
      required: [parentId, items, page, pageSize, totalCount]
      properties:
        parentId:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
        totalCount:
          type: integer
          format: int64
          minimum: 0
    FileEntryType:
      type: string
      enum: [FILE, FOLDER]
    FileEntryStatus:
      type: string
      enum: [ACTIVE, TRASHED]
    SortOrder:
      type: string
      enum: [asc, desc]
      default: desc
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId, details]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - AUTHENTICATION_REQUIRED
        - DEVICE_REGISTRATION_REQUIRES_LOCAL_DIRECT
        - DEVICE_REVOKED
        - REFRESH_TOKEN_REUSED
        - STORAGE_UNAVAILABLE
        - STORAGE_CAPACITY_INSUFFICIENT
        - FILE_NOT_FOUND
        - FILE_NAME_CONFLICT
        - FILE_MOVE_CYCLE
        - FILE_OPERATION_NOT_ALLOWED
        - FILE_RESTORE_CONFLICT
        - RECOVERY_REQUIRED
        - RANGE_NOT_SATISFIABLE
        - IDEMPOTENCY_CONFLICT
        - UPLOAD_SIZE_MISMATCH
        - UPLOAD_CHECKSUM_MISMATCH
        - OPERATION_SIZE_LIMIT_EXCEEDED
        - UPLOAD_SESSION_NOT_FOUND
        - UPLOAD_SESSION_EXPIRED
        - UPLOAD_SESSION_NOT_ACTIVE
        - UPLOAD_OFFSET_MISMATCH
        - CHUNK_CHECKSUM_MISMATCH
        - CHUNK_SIZE_LIMIT_EXCEEDED
        - FILE_SIZE_LIMIT_EXCEEDED
        - UPLOAD_LIMIT_REACHED
        - INTERNAL_ERROR
security:
  - bearerAuth: []
